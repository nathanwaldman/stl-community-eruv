<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>St. Louis Community Eruv — Printable Map</title>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
    <script src="shuls.js"></script>

    <style>
        html,
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f3ef;
        }

        body {
            padding: 16px;
        }

        .print-sheet {
            max-width: 1300px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 22px;
            color: #001a33;
        }

        .map-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 250px;
            gap: 18px;
            align-items: stretch;
        }

        #map {
            width: 100%;
            aspect-ratio: 1.335 / 1;
            min-height: 500px;
            border: 1px solid #9ba3aa;
            box-sizing: border-box;
            background: #faf9f4;
        }

        .legend {
            padding: 16px;
            border: 1px solid #aab0b5;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 26, 51, 0.08);
            box-sizing: border-box;
        }

        .legend h2 {
            padding-bottom: 8px;
            border-bottom: 2px solid #001a33;
            color: #001a33;
            font-size: 18px;
        }

        .legend-note {
            margin: 7px 0 13px;
            color: #62686d;
            font-size: 12px;
            line-height: 1.3;
        }

        .legend ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .legend li {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            margin: 0;
            padding: 7px 0;
            border-bottom: 1px solid #e3e5e6;
            line-height: 1.2;
        }

        .legend li:last-child {
            border-bottom: 0;
        }

        .legend-number {
            display: inline-flex;
            width: 26px;
            height: 26px;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #001a33;
            color: #fff;
            box-shadow: 0 0 0 1px #001a33;
            font-size: 12px;
            font-weight: bold;
            box-sizing: border-box;
        }

        .legend-name {
            font-size: 14px;
        }

        /*
         * Each shul marker is anchored at the shul's exact geographic
         * coordinate. The numbered bubble may be moved away from that point.
         */
        .shul-marker-anchor {
            position: relative;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        /*
         * Curved callout between the exact shul location and a displaced
         * numbered bubble.
         */
        .shul-marker-guide {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 3;
            display: none;
            overflow: visible;
            pointer-events: none;
        }

        /*
         * White halo keeps the callout visible when it crosses roads,
         * labels, or the dark eruv boundary.
         */
        .shul-marker-guide-halo {
            fill: none;
            stroke: #fff;
            stroke-width: 8;
            stroke-linecap: round;
        }

        /*
         * Callouts deliberately use a different color than the eruv boundary.
         */
        .shul-marker-guide-path {
            fill: none;
            stroke: #0900b16c;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /*
         * This dot remains at the shul's exact geographic coordinate.
         */
        .shul-marker-dot {
            position: absolute;
            left: -2px;
            top: -2px;
            z-index: 4;
            display: none;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #000a38;
            box-shadow: 0 0 0 1px #fff;
            box-sizing: border-box;
        }

        .shul-marker-bubble {
            position: absolute;
            left: -14px;
            top: -14px;
            z-index: 5;
            display: flex;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #001a33;
            color: #fff;
            box-shadow: 0 0 0 1px #001a33;
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
            box-sizing: border-box;
        }

        /*
         * Applied before print preview opens so MapLibre can resize its
         * WebGL canvas before Chrome or Firefox captures it.
         */
        html.printing .print-sheet {
            width: 10.5in;
            height: 7.5in;
            margin: 0 auto;
            padding-top: 0.25in;
            box-sizing: border-box;
        }

        html.printing .map-layout {
            grid-template-columns: 8.28in 2.05in;
            gap: 0.17in;
            width: 10.5in;
            height: 6.2in;
        }

        html.printing #map {
            width: 8.28in;
            height: 6.2in;
            min-height: 0;
            aspect-ratio: auto;
        }

        .map-actions {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .map-actions a,
        .map-actions button {
            padding: 8px 13px;
            border: 1px solid #9ba3aa;
            border-radius: 4px;
            background: #fff;
            color: #001a33;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .map-actions a:hover,
        .map-actions a:focus-visible,
        .map-actions button:hover,
        .map-actions button:focus-visible {
            outline: 2px solid #001a33;
            outline-offset: 1px;
        }

        @page {
            size: landscape;
            margin: 0.25in;
        }

        @media print {
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #fff;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            body {
                padding: 0;
            }

            .map-actions {
                display: none;
            }

            .print-sheet {
                width: 10.5in;
                height: 7.5in;
                margin: 0 auto;
                padding-top: 0.25in;
                overflow: hidden;
                box-sizing: border-box;
                break-inside: avoid;
                page-break-inside: avoid;
                page-break-after: avoid;
            }

            h1 {
                height: 0.35in;
                margin: 0 0 0.12in;
                font-size: 18pt;
                line-height: 0.35in;
            }

            .map-layout {
                grid-template-columns: 8.28in 2.05in;
                gap: 0.17in;
                width: 10.5in;
                height: 6.2in;
            }

            #map {
                width: 8.28in;
                height: 6.2in;
                min-height: 0;
                aspect-ratio: auto;
            }

            .legend {
                width: 2.05in;
                height: 6.2in;
                padding: 0.14in;
                border-radius: 0.06in;
                box-shadow: none;
                overflow: hidden;
            }

            .legend h2 {
                padding-bottom: 0.06in;
                font-size: 13pt;
                margin-bottom: 100px;
            }

            .legend-note {
                margin: 0.05in 0 0.08in;
                font-size: 8.5pt;
            }

            .legend li {
                grid-template-columns: 0.25in minmax(0, 1fr);
                gap: 0.07in;
                padding: 0.055in 0;
            }

            .legend-number {
                width: 0.23in;
                height: 0.23in;
                font-size: 8.5pt;
            }

            .legend-name {
                font-size: 9pt;
            }
        }
    </style>
</head>

<body>
    <nav class="map-actions" aria-label="Map actions">
        <a href="index.html">← Back to interactive map</a>
        <button type="button" onclick="printMap()">Print map</button>
    </nav>

    <div class="print-sheet">
        <h1>St. Louis Community Eruv</h1>

        <main class="map-layout">
            <div id="map"></div>

            <aside class="legend" aria-labelledby="shul-legend-title">
                <h2 id="shul-legend-title">Shuls within the Eruv</h2>
                <ul id="shul-list"></ul>
            </aside>
        </main>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="eruv-boundary.js?v2"></script>

    <script>
        const polygonCoordinates =
            ERUV_BOUNDARY.map(([lat, lng]) => [lng, lat]);

        // GeoJSON polygons must explicitly close the ring.
        polygonCoordinates.push(polygonCoordinates[0]);

        const eruvBounds = new maplibregl.LngLatBounds();
        polygonCoordinates.forEach(coord => eruvBounds.extend(coord));

        /*
         * Sorting here also determines the number shown on each map marker.
         *
         * With the current shuls.js:
         *   1 = Agudas Israel of St. Louis
         *   4 = Congregation Bais Menachem
         *   8 = Wash U Hillel
         *   9 = Young Israel of St. Louis
         *
         * shuls.js gives those clustered/boundary-adjacent locations explicit
         * printOffset values so their bubbles are separated and connected to
         * their exact locations by curved callouts.
         */
        const sortedShuls = [...window.SHULS].sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        const shulList = document.querySelector("#shul-list");

        sortedShuls.forEach((shul, index) => {
            const item = document.createElement("li");

            const number = document.createElement("span");
            number.className = "legend-number";
            number.textContent = index + 1;

            const name = document.createElement("span");
            name.className = "legend-name";
            name.textContent = shul.name;

            item.append(number, name);
            shulList.appendChild(item);
        });

        const map = new maplibregl.Map({
            container: "map",
            style: "https://tiles.openfreemap.org/styles/liberty",
            interactive: false,

            /*
             * Important for printing WebGL content. Without this, browsers may
             * clear the backing canvas before print preview captures it.
             */
            canvasContextAttributes: {
                preserveDrawingBuffer: true
            }
        });

        const shulMarkers = [];

        function hideMarkerGuide(entry) {
            entry.guideSvg.style.display = "none";
            entry.dot.style.display = "none";
        }

        /*
         * Draw a quadratic Bézier curve from the exact shul location at
         * (0, 0) to the center of the displaced numbered bubble at (dx, dy).
         */
        function showCurvedMarkerGuide(entry, dx, dy) {
            const padding = 14;

            const distance = Math.hypot(dx, dy);

            if (distance === 0) {
                hideMarkerGuide(entry);
                return;
            }

            /*
             * Bend the line perpendicular to the direct route between the
             * point and bubble. The bend is intentionally modest so the
             * callout is easy to follow.
             */
            const perpendicularX = -dy / distance;
            const perpendicularY = dx / distance;

            const curveAmount =
                Math.max(10, Math.min(20, distance * 0.25));

            /*
             * Alternate the direction of the bend depending on the bubble's
             * horizontal direction. This helps neighboring callouts separate
             * visually rather than stacking on the same curve.
             */
            const bendDirection = dx >= 0 ? 1 : -1;

            const controlX =
                dx / 2 +
                perpendicularX * curveAmount * bendDirection;

            const controlY =
                dy / 2 +
                perpendicularY * curveAmount * bendDirection;

            /*
             * SVG viewBox coordinates need to include the start, end, and
             * control point, plus room for the white halo.
             */
            const minX =
                Math.min(0, dx, controlX) - padding;

            const maxX =
                Math.max(0, dx, controlX) + padding;

            const minY =
                Math.min(0, dy, controlY) - padding;

            const maxY =
                Math.max(0, dy, controlY) + padding;

            const width = maxX - minX;
            const height = maxY - minY;

            const startX = -minX;
            const startY = -minY;

            const endX = dx - minX;
            const endY = dy - minY;

            const svgControlX = controlX - minX;
            const svgControlY = controlY - minY;

            const pathData =
                `M ${startX} ${startY} ` +
                `Q ${svgControlX} ${svgControlY} ${endX} ${endY}`;

            entry.guideSvg.setAttribute(
                "viewBox",
                `0 0 ${width} ${height}`
            );

            entry.guideSvg.setAttribute("width", width);
            entry.guideSvg.setAttribute("height", height);

            entry.guideSvg.style.left = `${minX}px`;
            entry.guideSvg.style.top = `${minY}px`;

            entry.guideHalo.setAttribute("d", pathData);
            entry.guidePath.setAttribute("d", pathData);

            entry.guideSvg.style.display = "block";
            entry.dot.style.display = "block";
        }

        function layoutShulMarkers() {
            if (shulMarkers.length === 0) {
                return;
            }

            const container = map.getContainer();
            const width = container.clientWidth;
            const height = container.clientHeight;

            const markerRadius = 14;
            const minimumDistance = 30;
            const edgePadding = markerRadius + 3;

            const occupied = [];

            /*
             * For ordinary markers, try the true location first, then move
             * outward only if another numbered circle would overlap it.
             *
             * Explicit printOffset values in shuls.js take precedence.
             */
            const candidateOffsets = [[0, 0]];

            [8, 12, 16, 20, 24, 28, 32, 40, 48, 56, 64].forEach(radius => {
                for (let angle = 0; angle < 360; angle += 30) {
                    const radians = angle * Math.PI / 180;

                    candidateOffsets.push([
                        Math.round(Math.cos(radians) * radius),
                        Math.round(Math.sin(radians) * radius)
                    ]);
                }
            });

            shulMarkers.forEach(entry => {
                const point =
                    map.project([entry.shul.long, entry.shul.lat]);

                let chosen =
                    candidateOffsets[candidateOffsets.length - 1];

                /*
                 * Manually assigned offsets make the dense western cluster
                 * and Wash U Hillel unambiguous.
                 */
                if (entry.shul.printOffset) {
                    chosen = entry.shul.printOffset;
                } else {
                    for (const offset of candidateOffsets) {
                        const x = point.x + offset[0];
                        const y = point.y + offset[1];

                        const insideMap =
                            x >= edgePadding &&
                            x <= width - edgePadding &&
                            y >= edgePadding &&
                            y <= height - edgePadding;

                        const clearOfMarkers = occupied.every(other =>
                            Math.hypot(
                                x - other.x,
                                y - other.y
                            ) >= minimumDistance
                        );

                        if (insideMap && clearOfMarkers) {
                            chosen = offset;
                            break;
                        }
                    }
                }

                const [dx, dy] = chosen;

                entry.bubble.style.transform =
                    `translate(${dx}px, ${dy}px)`;

                /*
                 * Any bubble that has moved away from the exact coordinate
                 * gets an exact-location dot and curved callout.
                 */
                if (dx !== 0 || dy !== 0) {
                    showCurvedMarkerGuide(entry, dx, dy);
                } else {
                    hideMarkerGuide(entry);
                }

                occupied.push({
                    x: point.x + dx,
                    y: point.y + dy
                });
            });
        }

        function fitMapToEruv() {
            map.resize();

            map.fitBounds(eruvBounds, {
                // Keep the full 5px boundary stroke visible.
                padding: 22,
                animate: false
            });

            layoutShulMarkers();
            map.triggerRepaint();
        }

        map.on("load", () => {
            map.addSource("eruv", {
                type: "geojson",
                data: {
                    type: "Feature",
                    geometry: {
                        type: "Polygon",
                        coordinates: [polygonCoordinates]
                    }
                }
            });

            /*
             * Hide everything outside the eruv. The exterior rectangle is
             * deliberately much larger than the visible map; the eruv ring
             * acts as a transparent hole.
             */
            const west = eruvBounds.getWest();
            const east = eruvBounds.getEast();
            const south = eruvBounds.getSouth();
            const north = eruvBounds.getNorth();

            const outerRing = [
                [west - 1, south - 1],
                [east + 1, south - 1],
                [east + 1, north + 1],
                [west - 1, north + 1],
                [west - 1, south - 1]
            ];

            map.addSource("outside-eruv", {
                type: "geojson",
                data: {
                    type: "Feature",
                    geometry: {
                        type: "Polygon",
                        coordinates: [
                            outerRing,
                            polygonCoordinates
                        ]
                    }
                }
            });

            map.addLayer({
                id: "outside-eruv-mask",
                type: "fill",
                source: "outside-eruv",
                paint: {
                    "fill-color": "#faf9f4",
                    "fill-opacity": 1
                }
            });

            map.addLayer({
                id: "eruv-boundary",
                type: "line",
                source: "eruv",
                paint: {
                    "line-color": "#001A33",
                    "line-width": 5
                }
            });

            sortedShuls.forEach((shul, index) => {
                const anchor = document.createElement("div");
                anchor.className = "shul-marker-anchor";

                /*
                 * SVG is used instead of CSS borders so the callout can be a
                 * smooth curve and print consistently in Chrome and Firefox.
                 */
                const guideSvg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );
                guideSvg.setAttribute(
                    "class",
                    "shul-marker-guide"
                );
                guideSvg.setAttribute(
                    "aria-hidden",
                    "true"
                );

                const guideHalo = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );
                guideHalo.setAttribute(
                    "class",
                    "shul-marker-guide-halo"
                );

                const guidePath = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );
                guidePath.setAttribute(
                    "class",
                    "shul-marker-guide-path"
                );

                guideSvg.append(
                    guideHalo,
                    guidePath
                );

                const dot = document.createElement("span");
                dot.className = "shul-marker-dot";

                const bubble = document.createElement("span");
                bubble.className = "shul-marker-bubble";
                bubble.textContent = index + 1;

                anchor.append(
                    guideSvg,
                    dot,
                    bubble
                );

                const marker = new maplibregl.Marker({
                    element: anchor,
                    anchor: "center"
                })
                    .setLngLat([
                        shul.long,
                        shul.lat
                    ])
                    .addTo(map);

                shulMarkers.push({
                    shul,
                    marker,
                    guideSvg,
                    guideHalo,
                    guidePath,
                    dot,
                    bubble
                });
            });

            fitMapToEruv();
        });

        /*
         * Print handling
         *
         * Chrome and Firefox do not necessarily resize a WebGL canvas at the
         * same point in their print-preview lifecycle. We therefore apply the
         * print dimensions ourselves before calling window.print(), force a
         * layout, resize/refit MapLibre, and allow the browser time to paint.
         */
        let printRestorePending = false;

        function preparePrintLayout() {
            document.documentElement.classList.add("printing");

            // Force the browser to apply the print dimensions immediately.
            void document.documentElement.offsetWidth;

            fitMapToEruv();
        }

        function restoreScreenLayout() {
            if (
                !document.documentElement.classList.contains("printing")
            ) {
                return;
            }

            document.documentElement.classList.remove("printing");

            /*
             * Allow the normal screen CSS dimensions to settle before
             * resizing MapLibre back to them.
             */
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    fitMapToEruv();
                });
            });
        }

        function queueRestoreAfterPrint() {
            if (printRestorePending) {
                return;
            }

            printRestorePending = true;

            setTimeout(() => {
                printRestorePending = false;

                if (!document.hidden) {
                    restoreScreenLayout();
                }
            }, 150);
        }

        function printMap() {
            preparePrintLayout();

            let printStarted = false;

            const startPrint = () => {
                if (printStarted) {
                    return;
                }

                printStarted = true;
                window.print();
            };

            /*
             * Two animation frames allow both CSS layout and the MapLibre
             * canvas dimensions to settle.
             */
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    fitMapToEruv();

                    /*
                     * MapLibre's idle event is the preferred indication that
                     * its resized WebGL frame is ready to capture.
                     */
                    if (map.loaded()) {
                        map.once("idle", () => {
                            setTimeout(startPrint, 120);
                        });
                    }

                    /*
                     * Fallback for browsers where the idle event is not fired
                     * during this exact print lifecycle.
                     */
                    setTimeout(startPrint, 500);
                });
            });
        }

        /*
         * beforeprint/afterprint work in current Chrome and Firefox.
         */
        window.addEventListener(
            "beforeprint",
            preparePrintLayout
        );

        window.addEventListener(
            "afterprint",
            restoreScreenLayout
        );

        window.addEventListener(
            "resize",
            () => requestAnimationFrame(layoutShulMarkers)
        );

        /*
         * matchMedia("print") provides another path for browsers whose
         * beforeprint/afterprint timing differs.
         */
        const printMedia = window.matchMedia("print");

        if (printMedia.addEventListener) {
            printMedia.addEventListener(
                "change",
                event => {
                    if (event.matches) {
                        preparePrintLayout();
                    } else {
                        restoreScreenLayout();
                    }
                }
            );
        } else if (printMedia.addListener) {
            /*
             * Older Firefox compatibility.
             */
            printMedia.addListener(event => {
                if (event.matches) {
                    preparePrintLayout();
                } else {
                    restoreScreenLayout();
                }
            });
        }

        /*
         * Some browser/OS combinations restore focus or visibility after
         * print preview without reliably firing afterprint. These are
         * harmless fallback cleanup paths.
         */
        window.addEventListener(
            "focus",
            queueRestoreAfterPrint
        );

        document.addEventListener(
            "visibilitychange",
            () => {
                if (!document.hidden) {
                    queueRestoreAfterPrint();
                }
            }
        );
    </script>
</body>

</html>
