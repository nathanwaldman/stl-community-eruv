<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>St. Louis Community Eruv</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --muted: #5c5c5c;
            --border: #ded8ca;
            --learn: #1f3529;
            --learn-soft: #e8efe9;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            --donate: #FCBB32;
            --donate-soft: #fdf2db;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.45;
        }

        .map-page {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        #map,
        .static-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #map[hidden],
        .static-map[hidden] {
            display: none;
        }

        .static-map {
            display: block;
            object-fit: cover;
        }

        .map-panel {
            position: absolute;
            z-index: 1000;
            top: 1rem;
            right: 1rem;
            width: min(23rem, calc(100% - 2rem));
            padding: 1rem;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .panel-label {
            margin: 0 0 0.35rem;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .actions {
            display: grid;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .donate-button {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 1rem 1.15rem;
            /* border: 1px solid #cfdccd; */
            border-radius: 14px;
            background: var(--donate-soft);
            cursor: pointer;
        }

        .learn-link {
            display: block;
            padding: 0.85rem 0.95rem;
            /* border: 1px solid #cfdccd; */
            border-radius: 14px;
            background: var(--learn-soft);
            color: var(--learn);
            text-decoration: none;
        }

        .learn-link strong,
        .learn-link span {
            display: block;
        }

        .learn-link span {
            margin-top: 0.15rem;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .learn-link:hover,
        .learn-link:focus-visible {
            outline: 2px solid var(--learn);
        }

        .donate-button:hover,
        .donate-button:focus-visible {
            outline: 2px solid var(--donate);
        }

        @media (max-width: 640px) {
            .map-panel {
                top: 0.5rem;
                right: 0.5rem;
                width: calc(100% - 1rem);
                padding: 0.85rem;
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="map-page" aria-labelledby="page-title">
        <img id="staticMap" class="static-map" src="eruv-static.png" alt="Map showing the St. Louis Community Eruv boundary" />
        <div id="map" hidden aria-label="Interactive map showing the St. Louis Community Eruv boundary"></div>

        <section class="map-panel" aria-label="St. Louis Community Eruv">
            <p class="panel-label">St. Louis Community Eruv</p>

            <div class="actions" aria-label="Primary actions">
                <span id="donate-button" class="donate-button"></span>
                
                <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
                <script>
                    PayPal.Donation.Button({
                        env:'production',
                        hosted_button_id:'V9BS79RJYPC5L',
                        image: {
                            title: 'Please help support our eruv',
                            src: 'https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif',
                            alt:'Donate with PayPal button',
                        }
                    }).render('#donate-button');

                    document.querySelector("#donate-button").onclick = function (event) {
                        if (event.target === this) {
                            this.querySelector("img")?.click();
                        }
                    };
                </script>

                <a class="learn-link" href="about.html">
                    <strong>Learn more about our eruv →</strong>
                    <span>History, background, and community information</span>
                </a>
            </div>
        </section>
    </main>

        function initInteractiveMap() {
            const mapElement = document.getElementById("map");
            const staticMap = document.getElementById("staticMap");

            if (!window.L || !mapElement) return;

            mapElement.hidden = false;

            const map = L.map("map");

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                referrerPolicy: "strict-origin-when-cross-origin",
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            const boundary = L.polygon(boundaryCoords, {
                color: "#00CCFF",
                weight: 4,
                opacity: 0.7,
                fillColor: "#00CC00",
                fillOpacity: 0.04
            }).addTo(map);

            map.fitBounds(boundary.getBounds(), {
                padding: [30, 30]
            });

            if (staticMap) staticMap.hidden = true;
        }
